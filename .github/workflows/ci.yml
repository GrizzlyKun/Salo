name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Types + lint
        run: npm run check

      - name: Validate content (lessons & courses, ES/EN)
        run: npm run validate:content

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
